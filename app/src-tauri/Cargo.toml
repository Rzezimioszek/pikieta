[package]
name = "pikieta-app"
version = "0.1.0"
description = "Pikieta: kalkulator geodezyjny z mapą"
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "pikieta_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5" }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
